<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 70px;
      height: 70px;
      background: #2563eb;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 12px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SP</div>

    <h1>School Portal</h1>

    <p class="subtitle">
      Welcome to the Student Management Portal
    </p>

    <div class="tabs">
      <button class="tab active" onclick="selectUser('Student', this)">
        Student
      </button>

      <button class="tab" onclick="selectUser('Staff', this)">
        Staff
      </button>
    </div>

    <form onsubmit="login(event)">

      <label id="usernameLabel">
        Admission Number
      </label>

      <input
        type="text"
        id="username"
        placeholder="Enter admission number"
        required
      >

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button class="login-btn" type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="#" class="forgot">
      Forgot Password?
    </a>

    <div class="footer">
      © 2026 School Portal
    </div>

  </div>

  <script>

    let selectedUser = "Student";

    function selectUser(type, button) {

      selectedUser = type;

      document.querySelectorAll(".tab").forEach(function(tab) {
        tab.classList.remove("active");
      });

      button.classList.add("active");

      const label = document.getElementById("usernameLabel");
      const input = document.getElementById("username");

      if (type === "Student") {
        label.textContent = "Admission Number";
        input.placeholder = "Enter admission number";
      } else {
        label.textContent = "Staff ID";
        input.placeholder = "Enter staff ID";
      }
    }

    function login(event) {

      event.preventDefault();

      const username = document.getElementById("username").value;
      const message = document.getElementById("message");

      if (username.trim() !== "") {

        message.style.color = "#2563eb";

        message.textContent =
          selectedUser + " login submitted successfully.";

      }
    }

  </script>

</body>
</html>
